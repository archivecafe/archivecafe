<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archive Café — Order</title>
<style>
body{font-family:Georgia,serif;background:#F5F2EB;color:#5B3B1C;margin:0;padding:0;}
.container{background:white;padding:40px;width:420px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.1);margin:50px auto;}
h1{text-align:center;margin-bottom:5px;}
.subtitle{text-align:center;color:#8B1E2D;font-size:14px;margin-bottom:25px;}
label{display:block;margin-top:15px;font-size:14px;}
input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:6px;font-family:inherit;}
button{margin-top:25px;width:100%;padding:12px;border:none;background:#8B1E2D;color:white;font-size:16px;border-radius:6px;cursor:pointer;}
button:hover{background:#6e1624;}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#777;}
.hidden{display:none;opacity:0;transition:opacity 0.5s ease;}
.visible{display:block;opacity:1;transition:opacity 0.5s ease;}
.checkbox-group{margin-top:10px;border:1px solid #ddd;padding:10px;border-radius:6px;background:#f9f6f2;}
.checkbox-group label{display:block;font-size:14px;margin-top:5px;}
.note{font-size:12px;color:#555;margin-top:3px;}
</style>
</head>
<body>

<div class="container">
<h1>Archive Café</h1>
<div class="subtitle">Place an Archive Order</div>

<form id="archiveForm" action="https://formspree.io/f/maqpbyaz" method="POST">

<input type="hidden" name="_subject" value="New Archive Order">

<label>Name</label>
<input type="text" name="name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone Number</label>
<input type="text" name="phone" required>

<label>Pickup or Delivery</label>
<select name="method" id="method" required>
  <option value="">-- Select --</option>
  <option value="Pickup">Pickup — Al Warqa 2, Dubai</option>
  <option value="Delivery">Delivery — All Across UAE (25–35 AED depending on area)</option>
</select>

<label>Preferred Date</label>
<input type="date" name="preferred_date" required>

<label>Select Your Box</label>
<select name="order_type" id="order_type" required>
  <option value="">-- Select --</option>
  <option value="Half Tray - 55 AED">Half Tray — 55 AED</option>
  <option value="Full Tray - 85 AED">Full Tray — 85 AED</option>
  <option value="Brownie with Ice Cream - 35 AED">Brownie with Ice Cream — 35 AED</option>
</select>

<!-- Flavor Selection -->
<label>Select Your Brownie</label>
<select name="flavor" required>
  <option value="Belgian Chocolate">Belgian Chocolate — Archive Collection</option>
  <option value="Nutella">Nutella — Archive Edition</option>
  <option value="Sea Salt Chocolate">Sea Salt Chocolate — Signature Archive</option>
  <option value="Kinder Pieces">Kinder Pieces — Special Archive</option>
  <option value="Pistachio">Pistachio — Limited Archive (+3 AED)</option>
  <option value="Mix">Mix — Curated Archive (+3 AED)</option>
</select>

<!-- Mix flavors for tray -->
<div id="mix_flavors_container" class="checkbox-group hidden">
  <label>Choose up to 3 Mix Flavors</label>
  <label><input type="checkbox" name="mix_flavors" value="Belgian Chocolate"> Belgian Chocolate</label>
  <label><input type="checkbox" name="mix_flavors" value="Nutella"> Nutella</label>
  <label><input type="checkbox" name="mix_flavors" value="Sea Salt Chocolate"> Sea Salt Chocolate</label>
  <label><input type="checkbox" name="mix_flavors" value="Kinder Pieces"> Kinder Pieces</label>
  <label><input type="checkbox" name="mix_flavors" value="Pistachio"> Pistachio (+3 AED)</label>
  <label><input type="checkbox" name="mix_flavors" value="Mix"> Mix (+3 AED)</label>
</div>

<!-- Brownie with Ice Cream -->
<div id="ice_cream_container" class="hidden">
  <label>Ice Cream Flavor (choose one)</label>
  <select name="ice_cream_flavor">
    <option value="Vanilla">Vanilla</option>
    <option value="Chocolate">Chocolate</option>
  </select>
  <label>Drizzle (choose one)</label>
  <select name="drizzle">
    <option value="Belgian Chocolate">Belgian Chocolate</option>
    <option value="Nutella">Nutella</option>
    <option value="Caramel">Caramel</option>
  </select>
</div>

<label>Extras (optional)</label>
<select name="extras_option">
  <option value="">-- None --</option>
  <option value="Message on top of brownies (+5 AED)">Message on top of brownies (+5 AED)</option>
  <option value="Written message on plain card (free)">Written message on plain card (free)</option>
</select>

<label>Notes (optional)</label>
<textarea name="notes" rows="3" placeholder="Additional notes..."></textarea>

<button type="submit">Archive My Box</button>
</form>

<div class="footer">
Archive Café • Freshly Archived Desserts<br>
Order 24 Hours in Advance (Delivery) | Order 1 Hour in Advance (Pickup)<br>
Instagram: @ARCHIVECAFE.AE
</div>
</div>

<script>
// Show/hide Mix flavors and Ice Cream options
const orderType = document.getElementById("order_type");
const mixContainer = document.getElementById("mix_flavors_container");
const iceCreamContainer = document.getElementById("ice_cream_container");

orderType.addEventListener("change", function(){
  if(this.value.includes("Mix")){
    mixContainer.classList.remove("hidden");
  } else {
    mixContainer.classList.add("hidden");
    mixContainer.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
  }

  if(this.value.includes("Brownie with Ice Cream")){
    iceCreamContainer.classList.remove("hidden");
  } else {
    iceCreamContainer.classList.add("hidden");
  }
});
</script>

</body>
</html>
